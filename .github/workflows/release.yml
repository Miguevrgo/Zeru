name: Upload Binaries to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # x86_64 Linux only: std reaches the kernel through Linux syscalls in x86_64
  # asm, so a compiler built for anything else could not build a program.
  upload-assets:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-llvm

      - name: Build Binary
        run: cargo build --release

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp target/release/zeru dist/zeru-linux-generic

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-std:
    name: Bundle & Upload std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Bundle std library
        run: |
          mkdir -p dist
          tar -czf dist/zeru-std.tar.gz std/

      - name: Upload std to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zeru-std.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

