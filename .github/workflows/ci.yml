name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Superseded runs of the same branch or PR are cancelled so pushing twice in a
# row does not queue two full matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheapest signal first, and the only job that needs no LLVM at all: it
  # reports in seconds instead of waiting on a toolchain install.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # Build and test the compiler on every free runner class, so a host-specific
  # assumption in codegen shows up here rather than in a release. The UI tests in
  # tests/ui.rs build and run Zeru programs, which std/builtin.zr ties to x86_64
  # Linux through raw syscalls, so they only run on that runner.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --release --verbose

  # Single gate to require in branch protection: adding or renaming a job above
  # then needs no settings change.
  ci:
    name: CI
    if: always()
    needs: [format, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "a required job reported: $result"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
